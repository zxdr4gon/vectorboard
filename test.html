<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Vector Sketch — Infinite Canvas Pro</title>
<link rel="icon" type="image/png" href="https://img.icons8.com/3d-sugary/100/class-1.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --graphite-900:#16171B;
    --graphite-800:#1E2024;
    --graphite-700:#292B31;
    --graphite-600:#3A3D44;
    --ink-soft:#C7C9D1;
    --ink-mute:#8A8D96;
    --paper:#E9EAEE;
    --signal:#35E0C6;
    --signal-soft:rgba(53,224,198,0.16);
    --danger:#FF5C5C;
    --radius-lg:18px;
    --radius-md:12px;
    --radius-sm:9px;
    --font-ui:'Space Grotesk', system-ui, -apple-system, sans-serif;
    --font-mono:'IBM Plex Mono', ui-monospace, 'SF Mono', monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--paper);font-family:var(--font-ui);}
  #c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;}

  html, body { transition: background 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
  body.dark-mode { --paper: #121316; }

  .panel{
    position:fixed; display:flex; align-items:center; gap:5px;
    background:linear-gradient(180deg, rgba(31,33,37,0.94), rgba(20,21,25,0.94));
    backdrop-filter:blur(16px) saturate(150%); -webkit-backdrop-filter:blur(16px) saturate(150%);
    border:1px solid rgba(255,255,255,0.07); border-radius:var(--radius-lg);
    box-shadow:0 12px 34px rgba(0,0,0,0.30), 0 1px 0 rgba(255,255,255,0.05) inset;
    padding:7px; z-index:10; user-select:none;
  }
  .panel-tools{ top:16px; left:50%; transform:translateX(-50%); flex-wrap:wrap; max-width:min(96vw, 1100px); justify-content:center; }
  .panel-view{ top:16px; right:16px; }

  .divider{ width:1px; align-self:stretch; min-height:26px; background:rgba(255,255,255,0.09); margin:0 3px; }

  button, select{ font-family:inherit; border:none; background:transparent; color:var(--ink-soft); cursor:pointer; }
  button:focus-visible, input:focus-visible, select:focus-visible{ outline:2px solid var(--signal); outline-offset:2px; }

  .tool-btn{
    width:36px; height:36px; display:flex; align-items:center; justify-content:center;
    border-radius:var(--radius-sm); transition:background .15s ease, color .15s ease, transform .1s ease;
    flex:0 0 auto;
  }
  .tool-btn svg{ width:18px; height:18px; }
  .tool-btn:hover{ background:var(--graphite-700); color:#fff; }
  .tool-btn.active{ background:var(--signal-soft); color:var(--signal); box-shadow:inset 0 0 0 1px rgba(53,224,198,0.45); }
  .tool-btn:active{ transform:scale(0.92); }

  .icon-btn{
    height:36px; padding:0 10px; display:flex; align-items:center; gap:6px;
    border-radius:var(--radius-sm); font-size:12px; font-weight:500; color:var(--ink-soft);
    transition:background .15s ease, color .15s ease; white-space:nowrap; flex:0 0 auto;
  }
  .icon-btn svg{ width:15px; height:15px; }
  .icon-btn:hover{ background:var(--graphite-700); color:#fff; }
  .icon-btn.square{ width:36px; padding:0; justify-content:center; }

  .swatches{ display:flex; align-items:center; gap:5px; padding:0 2px; }
  .swatch{ width:18px;height:18px;border-radius:50%; border:2px solid rgba(255,255,255,0.15); cursor:pointer; padding:0; transition:transform .12s ease; flex:0 0 auto; }
  .swatch:hover{ transform:scale(1.14); }
  .swatch.active{ border-color:var(--signal); box-shadow:0 0 0 2px rgba(53,224,198,0.28); }
  #customColor{ width:22px;height:22px;border:none;border-radius:50%;background:none;padding:0;cursor:pointer;flex:0 0 auto; }

  .size-group{ display:flex; align-items:center; gap:6px; padding:0 4px; }
  .size-group label{ font-size:10px; color:var(--ink-mute); font-family:var(--font-mono); text-transform:uppercase; }
  .size-group input[type=range]{ -webkit-appearance:none; appearance:none; width:60px; height:4px; border-radius:2px; background:var(--graphite-600); outline:none; }
  .size-group input[type=range]::-webkit-slider-thumb{ -webkit-appearance:none; width:12px;height:12px;border-radius:50%; background:var(--signal); cursor:pointer; }
  .size-value{ font-family:var(--font-mono); font-size:11px; color:var(--ink-soft); min-width:20px; text-align:right; }

  .readout{
    position:fixed; left:16px; bottom:16px; z-index:10;
    font-family:var(--font-mono); font-size:11px; letter-spacing:.03em; color:var(--ink-mute);
    background:rgba(20,21,25,0.88); backdrop-filter:blur(10px);
    border:1px solid rgba(255,255,255,0.07); border-radius:var(--radius-md);
    padding:9px 13px; display:flex; flex-direction:column; gap:3px; min-width:150px;
  }
  .readout .brand{ color:var(--signal); font-family:var(--font-ui); font-weight:600; font-size:10.5px; letter-spacing:.1em; text-transform:uppercase; }
  .readout .row{ display:flex; justify-content:space-between; gap:14px; }
  .readout .row b{ color:var(--ink-soft); font-weight:500; }

  /* Minimap UI */
  #minimapContainer{
    position:fixed; right:16px; bottom:16px; z-index:10;
    width:160px; height:110px; background:rgba(20,21,25,0.92);
    border:1px solid rgba(255,255,255,0.1); border-radius:var(--radius-md);
    overflow:hidden; box-shadow:0 8px 24px rgba(0,0,0,0.4); cursor:pointer;
  }
  #minimap{ width:100%; height:100%; display:block; }

  /* Inline Text Editor Overlay */
  #textEditor{
    position:fixed; display:none; z-index:30; background:transparent; border:1px dashed var(--signal);
    color:var(--graphite-900); font-family:var(--font-ui); outline:none; resize:none; overflow:hidden;
    padding:0; margin:0; line-height:1.2; white-space:pre;
  }

  .help-pop{
    position:fixed; top:60px; right:16px; z-index:11; background:rgba(20,21,25,0.96); backdrop-filter:blur(14px);
    border:1px solid rgba(255,255,255,0.08); border-radius:var(--radius-md); padding:14px 16px; width:280px;
    font-size:11.5px; color:var(--ink-soft); opacity:0; transform:translateY(-6px); pointer-events:none; transition:all .15s ease;
  }
  .help-pop.show{ opacity:1; transform:translateY(0); pointer-events:auto; }
  .help-title{ font-weight:600; color:#fff; font-size:12.5px; margin-bottom:8px; }
  .help-row{ display:flex; justify-content:space-between; gap:10px; padding:3px 0; border-top:1px solid rgba(255,255,255,0.05); }
  .help-row span:first-child{ font-family:var(--font-mono); color:var(--signal); }

  .toast{
    position:fixed; left:50%; bottom:26px; transform:translateX(-50%) translateY(12px);
    background:rgba(20,21,25,0.94); color:#fff; font-size:12.5px; padding:8px 16px; border-radius:999px;
    border:1px solid rgba(255,255,255,0.08); opacity:0; pointer-events:none; transition:all .2s ease; z-index:20;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  .panel.collapsed > *:not(.toggle-btn) { display: none !important; }
  .toggle-btn { color: var(--signal); }

  select.export-select {
    background: var(--graphite-800); color: var(--ink-soft); border: 1px solid rgba(255,255,255,0.1);
    border-radius: var(--radius-sm); padding: 4px 6px; font-size: 11px;
  }
</style>
</head>
<body>

<canvas id="c"></canvas>
<textarea id="textEditor"></textarea>

<!-- Tools Panel -->
<div class="panel panel-tools" id="toolPanel">
  <button class="icon-btn square toggle-btn" title="Toggle Menu">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="4 14 12 6 20 14"></polyline></svg>
  </button>
  
  <button class="tool-btn active" data-tool="pen" title="Pen (P)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 20l1-5L15.5 4.5l4 4L9 19l-5 1z"/><path d="M13.5 6.5l4 4"/></svg></button>
  <button class="tool-btn" data-tool="highlighter" title="Highlighter (G)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M15.5 3.5l5 5L8 21H3v-5L15.5 3.5z"/><line x1="14" y1="5" x2="19" y2="10"/></svg></button>
  <button class="tool-btn" data-tool="text" title="Text Tool (T)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><polyline points="4 7 4 4 20 4 20 7"/><line x1="12" y1="4" x2="12" y2="20"/><line x1="9" y1="20" x2="15" y2="20"/></svg></button>
  <button class="tool-btn" data-tool="eraser-stroke" title="Stroke Eraser (E)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><line x1="4" y1="19" x2="19" y2="4"/><line x1="7" y1="6" x2="18" y2="17"/></svg></button>
  <button class="tool-btn" data-tool="eraser-precision" title="Precision Eraser (X)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="8.5" y="8" width="7" height="8" rx="2"/><line x1="3" y1="12" x2="8.5" y2="12"/></svg></button>
  <button class="tool-btn" data-tool="hand" title="Hand / Pan (H)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="6" y="10.5" width="12" height="8.5" rx="3"/><line x1="9" y1="10.5" x2="9" y2="5"/><line x1="12" y1="10.5" x2="12" y2="4"/></svg></button>
  <button class="tool-btn" data-tool="select" title="Select & Transform (V)"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 3l7.5 17.5 2-7.3 7.3-2z"/></svg></button>

  <div class="divider"></div>

  <!-- Formatting Controls -->
  <div class="swatches" id="swatches">
    <button class="swatch active" data-color="#14151A" style="background:#14151A"></button>
    <button class="swatch" data-color="#3D5CFF" style="background:#3D5CFF"></button>
    <button class="swatch" data-color="#35E0C6" style="background:#35E0C6"></button>
    <button class="swatch" data-color="#FF5C5C" style="background:#FF5C5C"></button>
    <button class="swatch" data-color="#FFB020" style="background:#FFB020"></button>
    <input type="color" id="customColor" value="#14151A" title="Custom Color">
  </div>

  <div class="size-group">
    <label id="opacityLabel">Alpha</label>
    <input type="range" id="opacitySlider" min="0.1" max="1" step="0.05" value="1">
  </div>

  <div class="size-group">
    <label id="sizeLabel">Size</label>
    <input type="range" id="sizeSlider" min="1" max="80" value="6" step="1">
    <span class="size-value" id="sizeValue">6</span>
  </div>

  <div class="divider"></div>

  <!-- Smart Features Toggles -->
  <button class="tool-btn" id="snapBtn" title="Toggle Grid Snap"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M3 15h18M9 3v18M15 3v18"/></svg></button>
  <button class="tool-btn" id="smoothBtn" title="Toggle Bézier Smoothing (Active)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 17c4 0 5-10 9-10s5 10 9 10"/></svg></button>

  <div class="divider"></div>

  <button class="icon-btn square" id="groupBtn" title="Group (Ctrl+G)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg></button>
  <button class="icon-btn square" id="frontBtn" title="Bring to Front (])"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><polyline points="17 11 12 6 7 11"/><line x1="12" y1="6" x2="12" y2="18"/></svg></button>
  <button class="icon-btn square" id="backBtn" title="Send to Back ([)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><polyline points="17 13 12 18 7 13"/><line x1="12" y1="18" x2="12" y2="6"/></svg></button>

  <div class="divider"></div>

  <button class="icon-btn square" id="undoBtn" title="Undo (Ctrl+Z)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 7L4 12l5 5"/><path d="M4 12h11a5 5 0 010 10h-1"/></svg></button>
  <button class="icon-btn square" id="redoBtn" title="Redo (Ctrl+Y)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M15 7l5 5-5 5"/><path d="M20 12H9A5 5 0 009 22h1"/></svg></button>
</div>

<!-- View Panel -->
<div class="panel panel-view collapsed" id="viewPanel">
  <button class="icon-btn square toggle-btn" title="Toggle Menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="4 10 12 18 20 10"></polyline></svg></button>
  <button class="icon-btn" id="resetViewBtn">Reset</button>
  <button class="icon-btn square" id="themeBtn" title="Toggle Theme"><svg id="themeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg></button>
  <button class="icon-btn" id="clearCanvasBtn">Clear</button>
  <button class="icon-btn" id="saveFileBtn">Save</button>
  <button class="icon-btn" id="loadFileBtn">Open</button>
  <input type="file" id="fileInput" style="display:none" accept=".json">
  <div class="divider"></div>
  
  <select id="exportScope" class="export-select">
    <option value="all">All Content</option>
    <option value="viewport">Viewport View</option>
    <option value="selected">Selected Only</option>
  </select>
  <button class="icon-btn" id="exportPngBtn">PNG</button>
  <button class="icon-btn" id="exportSvgBtn">SVG</button>
  <div class="divider"></div>
  <button class="icon-btn square" id="helpBtn">?</button>
</div>

<!-- Minimap UI -->
<div id="minimapContainer" title="Click to navigate">
  <canvas id="minimap"></canvas>
</div>

<div class="help-pop" id="helpPop">
  <div class="help-title">Shortcuts</div>
  <div class="help-row"><span>P / G / T</span><span>Pen / Highlighter / Text</span></div>
  <div class="help-row"><span>E / X / V</span><span>Erasers / Select</span></div>
  <div class="help-row"><span>Ctrl+C / Ctrl+V</span><span>Copy / Paste</span></div>
  <div class="help-row"><span>Ctrl+G</span><span>Group / Ungroup</span></div>
  <div class="help-row"><span>Shift + 1..5</span><span>Save Bookmark 1..5</span></div>
  <div class="help-row"><span>1..5</span><span>Recall Bookmark 1..5</span></div>
  <div class="help-row"><span>Drag & Drop / Paste</span><span>Import Image</span></div>
</div>

<div class="readout" id="readoutPanel">
  <div class="brand">Infinite Vector Canvas</div>
  <div class="row"><span>Zoom</span><b id="zoomReadout">100%</b></div>
  <div class="row"><span>Cursor</span><b id="coordReadout">X 0  Y 0</b></div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  'use strict';

  // ---- DOM Setup -----------------------------------------------------------
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const minimapCanvas = document.getElementById('minimap');
  const minimapCtx = minimapCanvas.getContext('2d');
  const textEditor = document.getElementById('textEditor');
  let dpr = window.devicePixelRatio || 1;

  const sizeSlider = document.getElementById('sizeSlider');
  const sizeValue  = document.getElementById('sizeValue');
  const opacitySlider = document.getElementById('opacitySlider');
  const zoomReadout  = document.getElementById('zoomReadout');
  const coordReadout = document.getElementById('coordReadout');
  const toastEl = document.getElementById('toast');
  const helpPop = document.getElementById('helpPop');

  const MIN_ZOOM = 0.05, MAX_ZOOM = 40, HISTORY_LIMIT = 60;

  // ---- Application State ---------------------------------------------------
  const state = {
    tool: 'pen',            // 'pen'|'highlighter'|'text'|'eraser-stroke'|'eraser-precision'|'hand'|'select'
    color: '#14151A',
    opacity: 1,
    baseWidth: 6,
    fontSize: 24,
    eraserRadius: 22,
    snapToGrid: false,
    bezierSmooth: true,
  };

  const camera = { panX: 0, panY: 0, zoom: 1 };
  const bookmarks = {};      // Key 1-5 spatial positions

  let strokes = [];          // Master vector elements array
  let nextId = 1;
  const selectedIds = new Set();
  let clipboard = [];

  // Interaction variables
  const activePointers = new Map();
  let panState = null, currentStroke = null, lastDrawPoint = null;
  let erasing = null, selectDrag = null, rubberBand = null, transformHandle = null;
  let activeEditingText = null;
  let pinch = null, spaceDown = false, lastPointerScreen = null;
  let activeGuideLines = []; // [{x1,y1,x2,y2}] for smart snapping visualization

  let history = [], future = [];
  let needsRender = true;
  let isDarkMode = localStorage.getItem('canvas-theme') === 'dark';

  // ---- Helper Math & Spatial Functions -------------------------------------
  function clamp(v, lo, hi){ return Math.min(hi, Math.max(lo, v)); }
  function dist(a, b){ return Math.hypot(a.x - b.x, a.y - b.y); }

  function screenToWorld(sx, sy){
    return { x: (sx - camera.panX) / camera.zoom, y: (sy - camera.panY) / camera.zoom };
  }
  function worldToScreen(wx, wy){
    return { x: wx*camera.zoom + camera.panX, y: wy*camera.zoom + camera.panY };
  }

  // ---- Element Bounding Box Math ------------------------------------------
  function getElementBBox(el){
    if (el.type === 'text') {
      const w = el.width || (el.text.length * el.fontSize * 0.6);
      const h = el.height || (el.fontSize * 1.2);
      return { minX: el.x, minY: el.y, maxX: el.x + w, maxY: el.y + h };
    }
    if (el.type === 'image') {
      return { minX: el.x, minY: el.y, maxX: el.x + el.width, maxY: el.y + el.height };
    }
    // Default stroke BBox calculation
    let minX=Infinity, minY=Infinity, maxX=-Infinity, maxY=-Infinity;
    for (const pt of el.points){
      const hw = (el.baseWidth * (0.3 + (pt.p||0.5) * 1.4)) / 2;
      if (pt.x-hw < minX) minX = pt.x-hw;
      if (pt.x+hw > maxX) maxX = pt.x+hw;
      if (pt.y-hw < minY) minY = pt.y-hw;
      if (pt.y+hw > maxY) maxY = pt.y+hw;
    }
    return { minX, minY, maxX, maxY };
  }

  function getCombinedBBox(elementList){
    if (!elementList.length) return { minX: 0, minY: 0, maxX: 0, maxY: 0 };
    let minX=Infinity, minY=Infinity, maxX=-Infinity, maxY=-Infinity;
    for (const el of elementList){
      const b = getElementBBox(el);
      minX = Math.min(minX, b.minX); minY = Math.min(minY, b.minY);
      maxX = Math.max(maxX, b.maxX); maxY = Math.max(maxY, b.maxY);
    }
    return { minX, minY, maxX, maxY };
  }

  // ---- Catmull-Rom Spline Path Generator -----------------------------------
  function drawCatmullRomStroke(targetCtx, stroke) {
    const pts = stroke.points;
    if (pts.length < 3) {
      targetCtx.beginPath();
      targetCtx.moveTo(pts[0].x, pts[0].y);
      for (let i = 1; i < pts.length; i++) targetCtx.lineTo(pts[i].x, pts[i].y);
      targetCtx.stroke();
      return;
    }
    targetCtx.beginPath();
    targetCtx.moveTo(pts[0].x, pts[0].y);
    for (let i = 0; i < pts.length - 1; i++) {
      const p0 = pts[i === 0 ? i : i - 1];
      const p1 = pts[i];
      const p2 = pts[i + 1];
      const p3 = pts[i + 2 < pts.length ? i + 2 : i + 1];

      const cp1x = p1.x + (p2.x - p0.x) / 6;
      const cp1y = p1.y + (p2.y - p0.y) / 6;
      const cp2x = p2.x - (p3.x - p1.x) / 6;
      const cp2y = p2.y - (p3.y - p1.y) / 6;

      targetCtx.bezierCurveTo(cp1x, cp1y, cp2x, cp2y, p2.x, p2.y);
    }
    targetCtx.stroke();
  }

  // ---- Rendering Engine ---------------------------------------------------
  function getThemeColors() {
    return isDarkMode ? {
      paper: '#121316', gridMajor: 'rgba(255,255,255,0.07)', gridMinor: 'rgba(255,255,255,0.025)'
    } : {
      paper: '#E9EAEE', gridMajor: 'rgba(20,21,26,0.10)', gridMinor: 'rgba(20,21,26,0.045)'
    };
  }

  function drawElement(targetCtx, el) {
    targetCtx.save();
    targetCtx.globalAlpha = el.opacity !== undefined ? el.opacity : 1;

    if (el.type === 'text') {
      targetCtx.font = `${el.fontSize}px 'Space Grotesk', sans-serif`;
      targetCtx.fillStyle = isDarkMode && (el.color === '#14151A' || el.color === '#000000') ? '#FFFFFF' : el.color;
      targetCtx.textBaseline = 'top';
      const lines = el.text.split('\n');
      lines.forEach((line, idx) => {
        targetCtx.fillText(line, el.x, el.y + idx * el.fontSize * 1.2);
      });
    } else if (el.type === 'image') {
      if (el._imgObj && el._imgObj.complete) {
        targetCtx.drawImage(el._imgObj, el.x, el.y, el.width, el.height);
      } else if (!el._imgObj) {
        const img = new Image();
        img.src = el.src;
        img.onload = () => { el._imgObj = img; requestRenderNow(); };
      }
    } else { // Standard Stroke or Highlighter Path
      if (el.isHighlighter) {
        targetCtx.globalCompositeOperation = 'multiply';
        targetCtx.lineCap = 'square';
        targetCtx.lineJoin = 'miter';
      } else {
        targetCtx.lineCap = 'round';
        targetCtx.lineJoin = 'round';
      }

      const drawColor = isDarkMode && (el.color === '#14151A' || el.color === '#000000') ? '#FFFFFF' : el.color;
      targetCtx.strokeStyle = drawColor;
      targetCtx.fillStyle = drawColor;
      targetCtx.lineWidth = el.baseWidth;

      if (state.bezierSmooth && el.points.length > 2) {
        drawCatmullRomStroke(targetCtx, el);
      } else {
        targetCtx.beginPath();
        if (el.points.length === 1) {
          targetCtx.arc(el.points[0].x, el.points[0].y, el.baseWidth/2, 0, Math.PI*2);
          targetCtx.fill();
        } else {
          targetCtx.moveTo(el.points[0].x, el.points[0].y);
          for (let i = 1; i < el.points.length; i++) targetCtx.lineTo(el.points[i].x, el.points[i].y);
          targetCtx.stroke();
        }
      }
    }
    targetCtx.restore();
  }

  // ---- Transform Box & Handles --------------------------------------------
  function getTransformHandles(bbox) {
    const { minX, minY, maxX, maxY } = bbox;
    const midX = (minX + maxX)/2, midY = (minY + maxY)/2;
    return {
      nw: { x: minX, y: minY }, n: { x: midX, y: minY }, ne: { x: maxX, y: minY },
      e: { x: maxX, y: midY }, se: { x: maxX, y: maxY }, s: { x: midX, y: maxY },
      sw: { x: minX, y: maxY }, w: { x: minX, y: midY }
    };
  }

  function drawSelectionAndHandles() {
    if (!selectedIds.size) return;
    const selectedElements = strokes.filter(s => selectedIds.has(s.id));
    const bbox = getCombinedBBox(selectedElements);
    const pad = 8 / camera.zoom;

    ctx.save();
    ctx.strokeStyle = '#35E0C6';
    ctx.lineWidth = 1.5 / camera.zoom;
    ctx.strokeRect(bbox.minX - pad, bbox.minY - pad, (bbox.maxX - bbox.minX) + pad*2, (bbox.maxY - bbox.minY) + pad*2);

    // Draw 8 handle points
    const handles = getTransformHandles({ minX: bbox.minX - pad, minY: bbox.minY - pad, maxX: bbox.maxX + pad, maxY: bbox.maxY + pad });
    const handleSize = 7 / camera.zoom;

    ctx.fillStyle = '#16171B';
    for (const key in handles) {
      const h = handles[key];
      ctx.beginPath();
      ctx.rect(h.x - handleSize/2, h.y - handleSize/2, handleSize, handleSize);
      ctx.fill();
      ctx.stroke();
    }
    ctx.restore();
  }

  function drawSmartGuideLines() {
    if (!activeGuideLines.length) return;
    ctx.save();
    ctx.strokeStyle = '#FF5C5C';
    ctx.lineWidth = 1 / camera.zoom;
    ctx.setLineDash([4 / camera.zoom, 4 / camera.zoom]);
    for (const line of activeGuideLines) {
      ctx.beginPath();
      ctx.moveTo(line.x1, line.y1);
      ctx.lineTo(line.x2, line.y2);
      ctx.stroke();
    }
    ctx.restore();
  }

  // ---- Main Canvas Render Loop ---------------------------------------------
  function render() {
    const theme = getThemeColors();
    ctx.setTransform(1,0,0,1,0,0);
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = theme.paper;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.setTransform(dpr*camera.zoom, 0, 0, dpr*camera.zoom, dpr*camera.panX, dpr*camera.panY);

    // Draw Grid
    const topLeft = screenToWorld(0, 0);
    const bottomRight = screenToWorld(window.innerWidth, window.innerHeight);
    const spacing = 50;
    ctx.lineWidth = 1 / camera.zoom;
    ctx.strokeStyle = theme.gridMinor;
    for (let x = Math.floor(topLeft.x / spacing) * spacing; x < bottomRight.x; x += spacing) {
      ctx.beginPath(); ctx.moveTo(x, topLeft.y); ctx.lineTo(x, bottomRight.y); ctx.stroke();
    }
    for (let y = Math.floor(topLeft.y / spacing) * spacing; y < bottomRight.y; y += spacing) {
      ctx.beginPath(); ctx.moveTo(topLeft.x, y); ctx.lineTo(bottomRight.x, y); ctx.stroke();
    }

    // Render Scene Elements
    for (const el of strokes) drawElement(ctx, el);
    drawSelectionAndHandles();
    drawSmartGuideLines();

    if (rubberBand) {
      const r = { minX: Math.min(rubberBand.startWorld.x, rubberBand.curWorld.x),
                  minY: Math.min(rubberBand.startWorld.y, rubberBand.curWorld.y),
                  maxX: Math.max(rubberBand.startWorld.x, rubberBand.curWorld.x),
                  maxY: Math.max(rubberBand.startWorld.y, rubberBand.curWorld.y) };
      ctx.fillStyle = 'rgba(53,224,198,0.12)';
      ctx.strokeStyle = '#35E0C6';
      ctx.fillRect(r.minX, r.minY, r.maxX - r.minX, r.maxY - r.minY);
      ctx.strokeRect(r.minX, r.minY, r.maxX - r.minX, r.maxY - r.minY);
    }

    renderMinimap();
  }

  // ---- Canvas Minimap Radar -----------------------------------------------
  function renderMinimap() {
    minimapCtx.clearRect(0, 0, minimapCanvas.width, minimapCanvas.height);
    if (!strokes.length) return;

    const bbox = getCombinedBBox(strokes);
    const padding = 200;
    const worldW = Math.max(100, (bbox.maxX - bbox.minX) + padding * 2);
    const worldH = Math.max(100, (bbox.maxY - bbox.minY) + padding * 2);

    const scale = Math.min(minimapCanvas.width / worldW, minimapCanvas.height / worldH);
    const offX = (minimapCanvas.width - worldW * scale) / 2 - (bbox.minX - padding) * scale;
    const offY = (minimapCanvas.height - worldH * scale) / 2 - (bbox.minY - padding) * scale;

    minimapCtx.fillStyle = 'rgba(53,224,198,0.4)';
    for (const el of strokes) {
      const b = getElementBBox(el);
      minimapCtx.fillRect(b.minX * scale + offX, b.minY * scale + offY, (b.maxX - b.minX) * scale, (b.maxY - b.minY) * scale);
    }

    // Camera Screen Box in Minimap
    const camTL = screenToWorld(0, 0);
    const camBR = screenToWorld(window.innerWidth, window.innerHeight);
    minimapCtx.strokeStyle = '#FF5C5C';
    minimapCtx.lineWidth = 1.5;
    minimapCtx.strokeRect(camTL.x * scale + offX, camTL.y * scale + offY, (camBR.x - camTL.x) * scale, (camBR.y - camTL.y) * scale);
  }

  minimapCanvas.addEventListener('click', (e) => {
    const rect = minimapCanvas.getBoundingClientRect();
    const mx = e.clientX - rect.left, my = e.clientY - rect.top;
    const bbox = getCombinedBBox(strokes);
    const padding = 200;
    const worldW = Math.max(100, (bbox.maxX - bbox.minX) + padding * 2);
    const worldH = Math.max(100, (bbox.maxY - bbox.minY) + padding * 2);
    const scale = Math.min(minimapCanvas.width / worldW, minimapCanvas.height / worldH);
    const offX = (minimapCanvas.width - worldW * scale) / 2 - (bbox.minX - padding) * scale;
    const offY = (minimapCanvas.height - worldH * scale) / 2 - (bbox.minY - padding) * scale;

    const targetWorldX = (mx - offX) / scale;
    const targetWorldY = (my - offY) / scale;

    camera.panX = window.innerWidth / 2 - targetWorldX * camera.zoom;
    camera.panY = window.innerHeight / 2 - targetWorldY * camera.zoom;
    requestRenderNow();
  });

  // ---- Text Tool & Double Click Editing -----------------------------------
  function spawnTextEditor(el, isNew = false) {
    activeEditingText = el;
    const screenPos = worldToScreen(el.x, el.y);
    textEditor.style.left = screenPos.x + 'px';
    textEditor.style.top = screenPos.y + 'px';
    textEditor.style.fontSize = (el.fontSize * camera.zoom) + 'px';
    textEditor.style.color = el.color;
    textEditor.value = el.text || '';
    textEditor.style.display = 'block';
    setTimeout(() => textEditor.focus(), 50);
  }

  textEditor.addEventListener('blur', finalizeTextEditing);
  textEditor.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) { finalizeTextEditing(); }
  });

  function finalizeTextEditing() {
    if (!activeEditingText) return;
    const val = textEditor.value.trim();
    if (val) {
      pushHistory();
      activeEditingText.text = val;
      const lines = val.split('\n');
      ctx.font = `${activeEditingText.fontSize}px 'Space Grotesk', sans-serif`;
      let maxW = 0;
      lines.forEach(l => maxW = Math.max(maxW, ctx.measureText(l).width));
      activeEditingText.width = maxW || 50;
      activeEditingText.height = lines.length * activeEditingText.fontSize * 1.2;
    } else {
      strokes = strokes.filter(s => s !== activeEditingText);
    }
    textEditor.style.display = 'none';
    activeEditingText = null;
    saveToLocalStorage();
    requestRenderNow();
  }

  // ---- Smart Snapping Engine -----------------------------------------------
  function applySmartSnapping(movingBBox, dx, dy) {
    activeGuideLines = [];
    if (!state.snapToGrid) return { dx, dy };

    const snapThreshold = 6 / camera.zoom;
    let adjustedDx = dx, adjustedDy = dy;

    // Grid snap
    const gridSpacing = 50;
    const targetX = movingBBox.minX + dx;
    const targetY = movingBBox.minY + dy;

    const nearestGridX = Math.round(targetX / gridSpacing) * gridSpacing;
    const nearestGridY = Math.round(targetY / gridSpacing) * gridSpacing;

    if (Math.abs(targetX - nearestGridX) < snapThreshold) {
      adjustedDx = nearestGridX - movingBBox.minX;
      activeGuideLines.push({ x1: nearestGridX, y1: -10000, x2: nearestGridX, y2: 10000 });
    }
    if (Math.abs(targetY - nearestGridY) < snapThreshold) {
      adjustedDy = nearestGridY - movingBBox.minY;
      activeGuideLines.push({ x1: -10000, y1: nearestGridY, x2: 10000, y2: nearestGridY });
    }

    return { dx: adjustedDx, dy: adjustedDy };
  }

  // ---- Image Import & Clipboard Drag-and-Drop ------------------------------
  function importImageFile(file, worldX, worldY) {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.src = e.target.result;
      img.onload = () => {
        pushHistory();
        const aspect = img.width / img.height;
        const w = Math.min(400, img.width);
        const h = w / aspect;
        const newImg = {
          id: nextId++, type: 'image', x: worldX - w/2, y: worldY - h/2,
          width: w, height: h, src: e.target.result, _imgObj: img, opacity: 1
        };
        strokes.push(newImg);
        saveToLocalStorage();
        requestRenderNow();
        showToast('Image imported');
      };
    };
    reader.readAsDataURL(file);
  }

  window.addEventListener('dragover', e => e.preventDefault());
  window.addEventListener('drop', e => {
    e.preventDefault();
    const files = e.dataTransfer.files;
    if (files.length) {
      const pos = screenToWorld(e.clientX, e.clientY);
      importImageFile(files[0], pos.x, pos.y);
    }
  });

  window.addEventListener('paste', e => {
    const items = (e.clipboardData || e.originalEvent.clipboardData).items;
    for (const item of items) {
      if (item.type.indexOf('image') === 0) {
        const file = item.getAsFile();
        const center = screenToWorld(window.innerWidth/2, window.innerHeight/2);
        importImageFile(file, center.x, center.y);
      }
    }
  });

  // ---- User Interaction & Tools --------------------------------------------
  function hitTestElement(p) {
    for (let i = strokes.length - 1; i >= 0; i--) {
      const bbox = getElementBBox(strokes[i]);
      if (p.x >= bbox.minX && p.x <= bbox.maxX && p.y >= bbox.minY && p.y <= bbox.maxY) {
        return strokes[i];
      }
    }
    return null;
  }

  function startStroke(e) {
    pushHistory();
    const p = screenToWorld(e.clientX, e.clientY);
    const isHighlighter = state.tool === 'highlighter';
    currentStroke = {
      id: nextId++, type: 'stroke', color: state.color, opacity: isHighlighter ? 0.4 : state.opacity,
      baseWidth: isHighlighter ? state.baseWidth * 2.5 : state.baseWidth, isHighlighter,
      points: [{ x: p.x, y: p.y, p: e.pressure || 0.5 }]
    };
    strokes.push(currentStroke);
    lastDrawPoint = p;
    requestRenderNow();
  }

  function moveStroke(e) {
    if (!currentStroke) return;
    const p = screenToWorld(e.clientX, e.clientY);
    currentStroke.points.push({ x: p.x, y: p.y, p: e.pressure || 0.5 });
    requestRenderNow();
  }

  function endStroke() {
    currentStroke = null;
    saveToLocalStorage();
  }

  canvas.addEventListener('pointerdown', e => {
    canvas.setPointerCapture(e.pointerId);
    activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    const p = screenToWorld(e.clientX, e.clientY);

    if (e.button === 1 || spaceDown || state.tool === 'hand') {
      panState = { startScreenX: e.clientX, startScreenY: e.clientY, startPanX: camera.panX, startPanY: camera.panY };
      return;
    }

    if (state.tool === 'pen' || state.tool === 'highlighter') {
      startStroke(e);
    } else if (state.tool === 'text') {
      const newText = { id: nextId++, type: 'text', x: p.x, y: p.y, text: '', fontSize: state.fontSize, color: state.color, opacity: state.opacity };
      strokes.push(newText);
      spawnTextEditor(newText, true);
    } else if (state.tool === 'select') {
      const hit = hitTestElement(p);
      if (hit) {
        if (!e.shiftKey && !selectedIds.has(hit.id)) selectedIds.clear();
        selectedIds.add(hit.id);
        selectDrag = { lastWorld: p, historyPushed: false };
      } else {
        if (!e.shiftKey) selectedIds.clear();
        rubberBand = { startWorld: p, curWorld: p };
      }
      requestRenderNow();
    }
  });

  canvas.addEventListener('pointermove', e => {
    if (panState) {
      camera.panX = panState.startPanX + (e.clientX - panState.startScreenX);
      camera.panY = panState.startPanY + (e.clientY - panState.startScreenY);
      requestRenderNow();
      return;
    }
    if (currentStroke) moveStroke(e);
    if (selectDrag) {
      const p = screenToWorld(e.clientX, e.clientY);
      let dx = p.x - selectDrag.lastWorld.x, dy = p.y - selectDrag.lastWorld.y;

      const selectedObjs = strokes.filter(s => selectedIds.has(s.id));
      const bbox = getCombinedBBox(selectedObjs);
      const snapped = applySmartSnapping(bbox, dx, dy);

      if (!selectDrag.historyPushed) { pushHistory(); selectDrag.historyPushed = true; }

      for (const s of selectedObjs) {
        if (s.type === 'stroke') for (const pt of s.points) { pt.x += snapped.dx; pt.y += snapped.dy; }
        else { s.x += snapped.dx; s.y += snapped.dy; }
      }
      selectDrag.lastWorld = p;
      requestRenderNow();
    } else if (rubberBand) {
      rubberBand.curWorld = screenToWorld(e.clientX, e.clientY);
      const r = { minX: Math.min(rubberBand.startWorld.x, rubberBand.curWorld.x),
                  minY: Math.min(rubberBand.startWorld.y, rubberBand.curWorld.y),
                  maxX: Math.max(rubberBand.startWorld.x, rubberBand.curWorld.x),
                  maxY: Math.max(rubberBand.startWorld.y, rubberBand.curWorld.y) };
      selectedIds.clear();
      for (const s of strokes) {
        const b = getElementBBox(s);
        if (!(b.maxX < r.minX || b.minX > r.maxX || b.maxY < r.minY || b.minY > r.maxY)) selectedIds.add(s.id);
      }
      requestRenderNow();
    }
  });

  canvas.addEventListener('pointerup', () => {
    panState = null; endStroke(); selectDrag = null; rubberBand = null; activeGuideLines = [];
    saveToLocalStorage(); requestRenderNow();
  });

  canvas.addEventListener('dblclick', e => {
    const p = screenToWorld(e.clientX, e.clientY);
    const hit = hitTestElement(p);
    if (hit && hit.type === 'text') spawnTextEditor(hit);
  });

  canvas.addEventListener('wheel', e => {
    e.preventDefault();
    const factor = Math.exp(-e.deltaY * 0.0016);
    const before = screenToWorld(e.clientX, e.clientY);
    camera.zoom = clamp(camera.zoom * factor, MIN_ZOOM, MAX_ZOOM);
    camera.panX = e.clientX - before.x * camera.zoom;
    camera.panY = e.clientY - before.y * camera.zoom;
    requestRenderNow();
  }, { passive: false });

  // ---- Grouping & Layering Commands ---------------------------------------
  document.getElementById('groupBtn').addEventListener('click', toggleGrouping);
  document.getElementById('frontBtn').addEventListener('click', () => changeZIndex('front'));
  document.getElementById('backBtn').addEventListener('click', () => changeZIndex('back'));

  function toggleGrouping() {
    if (!selectedIds.size) return;
    pushHistory();
    const selected = strokes.filter(s => selectedIds.has(s.id));
    const isGrouped = selected.every(s => s.groupId);
    if (isGrouped) {
      selected.forEach(s => delete s.groupId);
      showToast('Ungrouped elements');
    } else {
      const gId = 'group_' + Date.now();
      selected.forEach(s => s.groupId = gId);
      showToast('Grouped elements');
    }
    saveToLocalStorage();
  }

  function changeZIndex(direction) {
    if (!selectedIds.size) return;
    pushHistory();
    const selected = strokes.filter(s => selectedIds.has(s.id));
    strokes = strokes.filter(s => !selectedIds.has(s.id));
    if (direction === 'front') strokes.push(...selected);
    else strokes.unshift(...selected);
    saveToLocalStorage(); requestRenderNow();
  }

  // ---- Keyboard Shortcuts & Spatial Bookmarks ------------------------------
  window.addEventListener('keydown', e => {
    if (document.activeElement.tagName === 'TEXTAREA' || document.activeElement.tagName === 'INPUT') return;

    if (e.code === 'Space') spaceDown = true;
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'c') copyToClipboard();
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'v') pasteFromClipboard();
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'g') { e.preventDefault(); toggleGrouping(); }
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') { e.preventDefault(); undo(); }
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'y') { e.preventDefault(); redo(); }

    // Spatial Bookmarks (1..5 and Shift+1..5)
    if (['1','2','3','4','5'].includes(e.key)) {
      if (e.shiftKey) {
        bookmarks[e.key] = { ...camera };
        showToast(`Bookmark ${e.key} saved`);
      } else if (bookmarks[e.key]) {
        camera.panX = bookmarks[e.key].panX;
        camera.panY = bookmarks[e.key].panY;
        camera.zoom = bookmarks[e.key].zoom;
        requestRenderNow();
        showToast(`Recalled Bookmark ${e.key}`);
      }
    }

    if (e.key === 'Delete' || e.key === 'Backspace') {
      if (selectedIds.size) {
        pushHistory();
        strokes = strokes.filter(s => !selectedIds.has(s.id));
        selectedIds.clear();
        saveToLocalStorage(); requestRenderNow();
      }
    }

    switch(e.key.toLowerCase()){
      case 'p': setTool('pen'); break;
      case 'g': setTool('highlighter'); break;
      case 't': setTool('text'); break;
      case 'e': setTool('eraser-stroke'); break;
      case 'x': setTool('eraser-precision'); break;
      case 'h': setTool('hand'); break;
      case 'v': setTool('select'); break;
    }
  });

  window.addEventListener('keyup', e => { if (e.code === 'Space') spaceDown = false; });

  // ---- Clipboard Engine ---------------------------------------------------
  function copyToClipboard() {
    clipboard = strokes.filter(s => selectedIds.has(s.id)).map(s => JSON.parse(JSON.stringify(s)));
    if (clipboard.length) showToast(`Copied ${clipboard.length} items`);
  }

  function pasteFromClipboard() {
    if (!clipboard.length) return;
    pushHistory();
    selectedIds.clear();
    for (const item of clipboard) {
      item.id = nextId++;
      if (item.type === 'stroke') item.points.forEach(p => { p.x += 30; p.y += 30; });
      else { item.x += 30; item.y += 30; }
      strokes.push(item);
      selectedIds.add(item.id);
    }
    saveToLocalStorage(); requestRenderNow();
    showToast('Pasted clipboard');
  }

  // ---- History & Serialization --------------------------------------------
  function pushHistory() {
    history.push(JSON.stringify(strokes));
    if (history.length > HISTORY_LIMIT) history.shift();
    future = [];
  }
  function undo() {
    if (!history.length) return;
    future.push(JSON.stringify(strokes));
    strokes = JSON.parse(history.pop());
    requestRenderNow();
  }
  function redo() {
    if (!future.length) return;
    history.push(JSON.stringify(strokes));
    strokes = JSON.parse(future.pop());
    requestRenderNow();
  }

  function saveToLocalStorage() {
    localStorage.setItem('infinite-canvas-pro-save', JSON.stringify(strokes));
  }

  // ---- Targeted Export Options --------------------------------------------
  document.getElementById('exportPngBtn').addEventListener('click', () => exportImage('png'));
  document.getElementById('exportSvgBtn').addEventListener('click', () => exportImage('svg'));

  function getExportElements() {
    const scope = document.getElementById('exportScope').value;
    if (scope === 'selected') return strokes.filter(s => selectedIds.has(s.id));
    if (scope === 'viewport') {
      const TL = screenToWorld(0,0), BR = screenToWorld(window.innerWidth, window.innerHeight);
      return strokes.filter(s => {
        const b = getElementBBox(s);
        return !(b.maxX < TL.x || b.minX > BR.x || b.maxY < TL.y || b.minY > BR.y);
      });
    }
    return strokes;
  }

  function exportImage(format) {
    const exportList = getExportElements();
    if (!exportList.length) { showToast('Nothing to export'); return; }

    const bbox = getCombinedBBox(exportList);
    const pad = 40, w = (bbox.maxX - bbox.minX) + pad*2, h = (bbox.maxY - bbox.minY) + pad*2;

    if (format === 'png') {
      const off = document.createElement('canvas');
      off.width = w * 2; off.height = h * 2;
      const octx = off.getContext('2d');
      octx.scale(2, 2);
      octx.fillStyle = '#FFFFFF';
      octx.fillRect(0, 0, w, h);
      octx.translate(pad - bbox.minX, pad - bbox.minY);
      for (const el of exportList) drawElement(octx, el);

      const a = document.createElement('a');
      a.href = off.toDataURL('image/png');
      a.download = 'canvas-export.png';
      a.click();
    } else {
      let svg = `<?xml version="1.0"?><svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}">`;
      svg += `<rect width="100%" height="100%" fill="#ffffff"/>`;
      const offX = pad - bbox.minX, offY = pad - bbox.minY;
      for (const el of exportList) {
        if (el.type === 'text') {
          svg += `<text x="${el.x + offX}" y="${el.y + offY + el.fontSize}" font-size="${el.fontSize}" fill="${el.color}">${el.text}</text>`;
        } else if (el.type === 'stroke') {
          let pathData = `M ${el.points[0].x + offX} ${el.points[0].y + offY}`;
          for (let i = 1; i < el.points.length; i++) pathData += ` L ${el.points[i].x + offX} ${el.points[i].y + offY}`;
          svg += `<path d="${pathData}" stroke="${el.color}" stroke-width="${el.baseWidth}" fill="none" stroke-linecap="round"/>`;
        }
      }
      svg += `</svg>`;
      const blob = new Blob([svg], { type: 'image/svg+xml' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'canvas-export.svg';
      a.click();
    }
  }

  // ---- UI Toolbar Wiring ---------------------------------------------------
  function setTool(t) {
    state.tool = t;
    document.querySelectorAll('.tool-btn').forEach(b => b.classList.toggle('active', b.dataset.tool === t));
  }
  document.querySelectorAll('.tool-btn[data-tool]').forEach(b => b.addEventListener('click', () => setTool(b.dataset.tool)));

  document.getElementById('snapBtn').addEventListener('click', (e) => {
    state.snapToGrid = !state.snapToGrid;
    e.currentTarget.classList.toggle('active', state.snapToGrid);
    showToast(`Grid Snap ${state.snapToGrid ? 'ON' : 'OFF'}`);
  });

  document.getElementById('smoothBtn').addEventListener('click', (e) => {
    state.bezierSmooth = !state.bezierSmooth;
    e.currentTarget.classList.toggle('active', state.bezierSmooth);
    showToast(`Bézier Smoothing ${state.bezierSmooth ? 'ON' : 'OFF'}`);
  });

  document.querySelectorAll('.swatch').forEach(btn => {
    btn.addEventListener('click', () => {
      state.color = btn.dataset.color;
      document.querySelectorAll('.swatch').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    });
  });

  sizeSlider.addEventListener('input', e => { state.baseWidth = Number(e.target.value); sizeValue.textContent = state.baseWidth; });
  opacitySlider.addEventListener('input', e => { state.opacity = Number(e.target.value); });

  document.getElementById('resetViewBtn').addEventListener('click', () => { camera.zoom = 1; camera.panX = window.innerWidth/2; camera.panY = window.innerHeight/2; requestRenderNow(); });
  document.getElementById('clearCanvasBtn').addEventListener('click', () => { if (confirm('Clear all content?')) { strokes = []; saveToLocalStorage(); requestRenderNow(); } });
  document.getElementById('undoBtn').addEventListener('click', undo);
  document.getElementById('redoBtn').addEventListener('click', redo);

  function requestRenderNow() { needsRender = true; }
  function updateReadouts() {
    zoomReadout.textContent = Math.round(camera.zoom * 100) + '%';
    if (lastPointerScreen) {
      const w = screenToWorld(lastPointerScreen.x, lastPointerScreen.y);
      coordReadout.textContent = `X ${w.x.toFixed(0)}  Y ${w.y.toFixed(0)}`;
    }
  }

  function frameLoop() {
    if (needsRender) { render(); needsRender = false; updateReadouts(); }
    requestAnimationFrame(frameLoop);
  }

  function resize() {
    dpr = window.devicePixelRatio || 1;
    canvas.width = Math.round(window.innerWidth * dpr); canvas.height = Math.round(window.innerHeight * dpr);
    canvas.style.width = window.innerWidth + 'px'; canvas.style.height = window.innerHeight + 'px';
    minimapCanvas.width = 160; minimapCanvas.height = 110;
    requestRenderNow();
  }

  function showToast(msg) {
    toastEl.textContent = msg; toastEl.classList.add('show');
    setTimeout(() => toastEl.classList.remove('show'), 2000);
  }

  // Initialization
  function init() {
    resize();
    window.addEventListener('resize', resize);
    const saved = localStorage.getItem('infinite-canvas-pro-save');
    if (saved) {
      try { strokes = JSON.parse(saved); } catch(err){}
    }
    camera.panX = window.innerWidth / 2; camera.panY = window.innerHeight / 2;
    requestAnimationFrame(frameLoop);
  }
  init();
})();
</script>
</body>
</html>
