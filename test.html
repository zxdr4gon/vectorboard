<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Vector Sketch — Infinite Canvas</title>
<link rel="icon" type="image/png" href="https://img.icons8.com/neon/96/8.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --graphite-900:#16171B;
    --graphite-800:#1E2024;
    --graphite-700:#292B31;
    --graphite-600:#3A3D44;
    --ink-soft:#C7C9D1;
    --ink-mute:#8A8D96;
    --paper:#E9EAEE;
    --signal:#35E0C6;
    --signal-soft:rgba(53,224,198,0.16);
    --danger:#FF5C5C;
    --radius-lg:18px;
    --radius-md:12px;
    --radius-sm:9px;
    --font-ui:'Space Grotesk', system-ui, -apple-system, sans-serif;
    --font-mono:'IBM Plex Mono', ui-monospace, 'SF Mono', monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--paper);font-family:var(--font-ui);}
  #c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;}

  .panel{
    position:fixed;
    display:flex;
    align-items:center;
    gap:5px;
    background:linear-gradient(180deg, rgba(31,33,37,0.94), rgba(20,21,25,0.94));
    backdrop-filter:blur(16px) saturate(150%);
    -webkit-backdrop-filter:blur(16px) saturate(150%);
    border:1px solid rgba(255,255,255,0.07);
    border-radius:var(--radius-lg);
    box-shadow:0 12px 34px rgba(0,0,0,0.30), 0 1px 0 rgba(255,255,255,0.05) inset;
    padding:7px;
    z-index:10;
    user-select:none;
  }
  .panel-tools{ top:16px; left:50%; transform:translateX(-50%); flex-wrap:wrap; max-width:min(94vw, 940px); justify-content:center; }
  .panel-view{ top:16px; right:16px; }

  .divider{ width:1px; align-self:stretch; min-height:26px; background:rgba(255,255,255,0.09); margin:0 3px; }

  button{ font-family:inherit; border:none; background:transparent; color:var(--ink-soft); cursor:pointer; }
  button:focus-visible, input:focus-visible{ outline:2px solid var(--signal); outline-offset:2px; }

  .tool-btn{
    width:36px; height:36px; display:flex; align-items:center; justify-content:center;
    border-radius:var(--radius-sm);
    transition:background .15s ease, color .15s ease, transform .1s ease;
    flex:0 0 auto;
  }
  .tool-btn svg{ width:18px; height:18px; }
  .tool-btn:hover{ background:var(--graphite-700); color:#fff; }
  .tool-btn.active{ background:var(--signal-soft); color:var(--signal); box-shadow:inset 0 0 0 1px rgba(53,224,198,0.45); }
  .tool-btn:active{ transform:scale(0.92); }

  .icon-btn{
    height:36px; padding:0 12px; display:flex; align-items:center; gap:6px;
    border-radius:var(--radius-sm); font-size:12.5px; font-weight:500; letter-spacing:.01em; color:var(--ink-soft);
    transition:background .15s ease, color .15s ease; white-space:nowrap; flex:0 0 auto;
  }
  .icon-btn svg{ width:15px; height:15px; }
  .icon-btn:hover{ background:var(--graphite-700); color:#fff; }
  .icon-btn:disabled{ opacity:.32; cursor:default; }
  .icon-btn:disabled:hover{ background:transparent; color:var(--ink-soft); }
  .icon-btn.primary{ background:var(--signal); color:#0A1512; font-weight:600; }
  .icon-btn.primary:hover{ background:#57ecd4; color:#0A1512; }
  .icon-btn.square{ width:36px; padding:0; justify-content:center; }

  .swatches{ display:flex; align-items:center; gap:6px; padding:0 4px; }
  .swatch{ width:20px;height:20px;border-radius:50%; border:2px solid rgba(255,255,255,0.15); cursor:pointer; padding:0; transition:transform .12s ease, border-color .12s ease; flex:0 0 auto; }
  .swatch:hover{ transform:scale(1.14); }
  .swatch.active{ border-color:var(--signal); box-shadow:0 0 0 2px rgba(53,224,198,0.28); }
  #customColor{ width:24px;height:24px;border:none;border-radius:50%;background:none;padding:0;cursor:pointer;flex:0 0 auto; }
  #customColor::-webkit-color-swatch-wrapper{padding:0;border-radius:50%;}
  #customColor::-webkit-color-swatch{border:2px solid rgba(255,255,255,0.15);border-radius:50%;}
  #customColor::-moz-color-swatch{border:2px solid rgba(255,255,255,0.15);border-radius:50%;}

  .size-group{ display:flex; align-items:center; gap:8px; padding:0 8px; }
  .size-group label{ font-size:10.5px; color:var(--ink-mute); font-family:var(--font-mono); min-width:64px; text-transform:uppercase; letter-spacing:.05em; }
  .size-group input[type=range]{ -webkit-appearance:none; appearance:none; width:84px; height:4px; border-radius:2px; background:var(--graphite-600); outline:none; }
  .size-group input[type=range]::-webkit-slider-thumb{ -webkit-appearance:none; width:14px;height:14px;border-radius:50%; background:var(--signal); cursor:pointer; border:2px solid #0F1113; margin-top:-5px; }
  .size-group input[type=range]::-moz-range-thumb{ width:14px;height:14px;border-radius:50%; background:var(--signal); border:2px solid #0F1113; cursor:pointer; }
  .size-group input[type=range]::-moz-range-track{ height:4px; border-radius:2px; background:var(--graphite-600); }
  .size-value{ font-family:var(--font-mono); font-size:11px; color:var(--ink-soft); min-width:20px; text-align:right; }

  .readout{
    position:fixed; left:16px; bottom:16px; z-index:10;
    font-family:var(--font-mono); font-size:11px; letter-spacing:.03em; color:var(--ink-mute);
    background:rgba(20,21,25,0.88); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
    border:1px solid rgba(255,255,255,0.07); border-radius:var(--radius-md);
    padding:9px 13px; display:flex; flex-direction:column; gap:3px; min-width:150px;
  }
  .readout .brand{ color:var(--signal); font-family:var(--font-ui); font-weight:600; font-size:10.5px; letter-spacing:.1em; text-transform:uppercase; margin-bottom:2px; }
  .readout .row{ display:flex; justify-content:space-between; gap:14px; }
  .readout .row b{ color:var(--ink-soft); font-weight:500; }

  .help-pop{
    position:fixed; top:60px; right:16px; z-index:11;
    background:rgba(20,21,25,0.96); backdrop-filter:blur(14px);
    border:1px solid rgba(255,255,255,0.08); border-radius:var(--radius-md);
    padding:14px 16px; width:250px; font-size:11.5px; color:var(--ink-soft);
    box-shadow:0 14px 36px rgba(0,0,0,.35);
    opacity:0; transform:translateY(-6px); pointer-events:none; transition:opacity .15s ease, transform .15s ease;
  }
  .help-pop.show{ opacity:1; transform:translateY(0); pointer-events:auto; }
  .help-pop .help-title{ font-family:var(--font-ui); font-weight:600; color:#fff; font-size:12.5px; margin-bottom:8px; letter-spacing:.02em; }
  .help-row{ display:flex; justify-content:space-between; gap:10px; padding:3px 0; border-top:1px solid rgba(255,255,255,0.05); }
  .help-row:first-of-type{ border-top:none; }
  .help-row span:first-child{ font-family:var(--font-mono); color:var(--signal); font-size:10.5px; white-space:nowrap; }
  .help-row span:last-child{ text-align:right; color:var(--ink-mute); }

  .toast{
    position:fixed; left:50%; bottom:26px; transform:translateX(-50%) translateY(12px);
    background:rgba(20,21,25,0.94); color:#fff; font-size:12.5px; font-family:var(--font-ui);
    padding:9px 18px; border-radius:999px; border:1px solid rgba(255,255,255,0.08);
    opacity:0; pointer-events:none; transition:opacity .2s ease, transform .2s ease; z-index:20;
    box-shadow:0 10px 26px rgba(0,0,0,.32);
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  /* Minimize Panel Logic */
  .panel.collapsed > *:not(.toggle-btn) {
    display: none !important;
  }
  .toggle-btn {
    color: var(--signal); 
  }
  
  @media (max-width:720px){
    .size-group label{ display:none; }
    .size-group input[type=range]{ width:56px; }
    .readout{ min-width:0; }
    .help-pop{ right:16px; left:16px; width:auto; }
  }
</style>
</head>
<body>

<canvas id="c"></canvas>

<!-- Tools + brush panel -->
<div class="panel panel-tools" id="toolPanel">
  <button class="icon-btn square toggle-btn" title="Toggle Menu">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 14 12 6 20 14"></polyline></svg>
  </button>
  
  <button class="tool-btn" data-tool="pen" title="Pen (P)" aria-label="Pen">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20l1-5L15.5 4.5l4 4L9 19l-5 1z"/><path d="M13.5 6.5l4 4"/></svg>
  </button>
  <button class="tool-btn" data-tool="eraser-stroke" title="Stroke Eraser — deletes whole strokes (E)" aria-label="Stroke Eraser">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="19" x2="19" y2="4"/><line x1="7" y1="6" x2="18" y2="17"/><line x1="18" y1="6" x2="7" y2="17"/></svg>
  </button>
  <button class="tool-btn" data-tool="eraser-precision" title="Precision Eraser — cuts through paths (X)" aria-label="Precision Eraser">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="8.5" y2="12"/><line x1="15.5" y1="12" x2="21" y2="12"/><rect x="8.5" y="8" width="7" height="8" rx="2"/></svg>
  </button>
  <button class="tool-btn" data-tool="hand" title="Hand / Pan (H)" aria-label="Hand tool">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="10.5" width="12" height="8.5" rx="3"/><line x1="9" y1="10.5" x2="9" y2="5"/><line x1="12" y1="10.5" x2="12" y2="4"/><line x1="15" y1="10.5" x2="15" y2="5.5"/></svg>
  </button>
  <button class="tool-btn" data-tool="select" title="Select (V)" aria-label="Select tool">
    <svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M4 3l7.5 17.5 2-7.3 7.3-2z"/></svg>
  </button>

  <div class="divider"></div>

  <div class="swatches" id="swatches">
    <button class="swatch" data-color="#14151A" style="background:#14151A" title="Ink"></button>
    <button class="swatch" data-color="#3D5CFF" style="background:#3D5CFF" title="Indigo"></button>
    <button class="swatch" data-color="#35E0C6" style="background:#35E0C6" title="Signal"></button>
    <button class="swatch" data-color="#FF5C5C" style="background:#FF5C5C" title="Red"></button>
    <button class="swatch" data-color="#FFB020" style="background:#FFB020" title="Amber"></button>
    <input type="color" id="customColor" value="#14151A" title="Custom color">
  </div>

  <div class="divider"></div>

  <div class="size-group">
    <label id="sizeLabel">Brush size</label>
    <input type="range" id="sizeSlider" min="1" max="60" value="6" step="1">
    <span class="size-value" id="sizeValue">6</span>
  </div>

  <div class="divider"></div>

  <button class="icon-btn square" id="undoBtn" title="Undo (Ctrl+Z)" aria-label="Undo">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 7L4 12l5 5"/><path d="M4 12h11a5 5 0 010 10h-1"/></svg>
  </button>
  <button class="icon-btn square" id="redoBtn" title="Redo (Ctrl+Shift+Z)" aria-label="Redo">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 7l5 5-5 5"/><path d="M20 12H9A5 5 0 009 22h1"/></svg>
  </button>
</div>

<!-- View + export panel -->
<div class="panel panel-view collapsed" id="viewPanel">
  <button class="icon-btn square toggle-btn" title="Toggle Menu">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 10 12 18 20 10"></polyline></svg>
  </button>
  
  <button class="icon-btn" id="resetViewBtn" title="Reset view (0)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l2.5 2.5"/></svg>
    Reset
  </button>
  <!-- clear canvas -->
  <button class="icon-btn" id="clearCanvasBtn" title="Clear Canvas">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
    Clear
  </button>
  <button class="icon-btn" id="saveFileBtn" title="Save to File">Save File</button>
  <button class="icon-btn" id="loadFileBtn" title="Open File">Open File</button>
  <input type="file" id="fileInput" style="display:none" accept=".json">
  <div class="divider"></div>
  <button class="icon-btn" id="exportPngBtn" title="Export PNG">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 15v3a2 2 0 002 2h12a2 2 0 002-2v-3"/><path d="M7 10l5 5 5-5"/><path d="M12 15V4"/></svg>
    PNG
  </button>
  <button class="icon-btn" id="exportSvgBtn" title="Export SVG">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 15v3a2 2 0 002 2h12a2 2 0 002-2v-3"/><path d="M7 10l5 5 5-5"/><path d="M12 15V4"/></svg>
    SVG
  </button>
  <div class="divider"></div>
  <button class="icon-btn square" id="helpBtn" title="Keyboard shortcuts" aria-label="Shortcuts">?</button>
</div>

<div class="help-pop" id="helpPop">
  <div class="help-title">Shortcuts</div>
  <div class="help-row"><span>P</span><span>Pen</span></div>
  <div class="help-row"><span>E</span><span>Stroke eraser</span></div>
  <div class="help-row"><span>X</span><span>Precision eraser</span></div>
  <div class="help-row"><span>H</span><span>Hand / pan</span></div>
  <div class="help-row"><span>V</span><span>Select</span></div>
  <div class="help-row"><span>Space (hold)</span><span>Pan</span></div>
  <div class="help-row"><span>Mid-click / Shift-drag</span><span>Pan</span></div>
  <div class="help-row"><span>Scroll / Pinch</span><span>Zoom</span></div>
  <div class="help-row"><span>0</span><span>Reset view</span></div>
  <div class="help-row"><span>Del</span><span>Delete selection</span></div>
  <div class="help-row"><span>Ctrl+Z / ⇧Z</span><span>Undo / Redo</span></div>
</div>

<div class="readout" id="readoutPanel">
  <div class="brand">Infinite canvas</div>
  <div class="row"><span>Zoom</span><b id="zoomReadout">100%</b></div>
  <div class="row"><span>Cursor</span><b id="coordReadout">X 0  Y 0</b></div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  'use strict';

  /* =========================================================================
     VECTOR SKETCH — INFINITE CANVAS PROTOTYPE
     -------------------------------------------------------------------------
     Data model: every stroke is stored as resolution-agnostic world-space
     data — an array of {x, y, p} points (p = normalized pressure 0..1) plus
     a color and a base width. Nothing is ever rasterized into the source of
     truth: the canvas is cleared and fully re-drawn from this vector data
     every frame, through a camera transform matrix. That's what keeps lines
     razor-sharp at any zoom level, and it's also what makes PNG/SVG export
     trivial — export just replays the same data through a different matrix.
     ========================================================================= */

  // ---- DOM ----------------------------------------------------------------
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  let dpr = window.devicePixelRatio || 1;

  const sizeSlider = document.getElementById('sizeSlider');
  const sizeValue  = document.getElementById('sizeValue');
  const sizeLabel  = document.getElementById('sizeLabel');
  const zoomReadout  = document.getElementById('zoomReadout');
  const coordReadout = document.getElementById('coordReadout');
  const toastEl = document.getElementById('toast');
  const helpPop = document.getElementById('helpPop');

  // ---- constants ------------------------------------------------------------
  const MIN_ZOOM = 0.05, MAX_ZOOM = 40, HISTORY_LIMIT = 60;
  const PAPER_COLOR = '#E9EAEE';

  // ---- app state --------------------------------------------------------
  const state = {
    tool: 'pen',            // 'pen' | 'eraser-stroke' | 'eraser-precision' | 'hand' | 'select'
    color: '#14151A',
    baseWidth: 6,            // world units — pen brush diameter at full pressure
    eraserRadius: 22,        // SCREEN pixels — kept constant on screen regardless of zoom
  };

  const camera = { panX: 0, panY: 0, zoom: 1 }; // world->screen: s = w*zoom + pan

  let strokes = [];          // the entire drawing, in world space
  let nextId = 1;
  const selectedIds = new Set();

  // interaction state
  const activePointers = new Map(); // pointerId -> {x,y} in screen space
  let panState = null;
  let currentStroke = null, lastDrawPoint = null;
  let erasing = null;         // { mode: 'stroke' | 'precision' }
  let selectDrag = null;      // { lastWorld, historyPushed }
  let rubberBand = null;      // { startWorld, curWorld }
  let pinch = null;
  let spaceDown = false;
  let lastPointerScreen = null;

  let history = [], future = [];
  let needsRender = true;

  // load memory in browser
  function loadLocalStrokes() {
  const saved = localStorage.getItem('infinite-canvas-save');
  if (saved) strokes = JSON.parse(saved);
}

  // ---- small math helpers -------------------------------------------------
  function clamp(v, lo, hi){ return Math.min(hi, Math.max(lo, v)); }
  function dist(a, b){ return Math.hypot(a.x - b.x, a.y - b.y); }
  function distToSegment(p, a, b){
    const dx = b.x - a.x, dy = b.y - a.y;
    const lenSq = dx*dx + dy*dy;
    if (lenSq === 0) return Math.hypot(p.x - a.x, p.y - a.y);
    let t = ((p.x - a.x)*dx + (p.y - a.y)*dy) / lenSq;
    t = clamp(t, 0, 1);
    return Math.hypot(p.x - (a.x + t*dx), p.y - (a.y + t*dy));
  }
  function normalizeRect(a, b){
    return { minX: Math.min(a.x,b.x), minY: Math.min(a.y,b.y), maxX: Math.max(a.x,b.x), maxY: Math.max(a.y,b.y) };
  }
  function getEvents(e){
    if (typeof e.getCoalescedEvents === 'function'){
      const list = e.getCoalescedEvents();
      if (list && list.length) return list;
    }
    return [e];
  }

  // ---- camera transform ----------------------------------------------------
  function screenToWorld(sx, sy){
    return { x: (sx - camera.panX) / camera.zoom, y: (sy - camera.panY) / camera.zoom };
  }
  function worldToScreen(wx, wy){
    return { x: wx*camera.zoom + camera.panX, y: wy*camera.zoom + camera.panY };
  }
  function zoomAt(sx, sy, factor){
    const before = screenToWorld(sx, sy);
    camera.zoom = clamp(camera.zoom * factor, MIN_ZOOM, MAX_ZOOM);
    camera.panX = sx - before.x * camera.zoom;
    camera.panY = sy - before.y * camera.zoom;
    requestRenderNow();
  }
  function resetView(){
    camera.zoom = 1;
    camera.panX = window.innerWidth / 2;
    camera.panY = window.innerHeight / 2;
    requestRenderNow();
  }

  // ---- stroke geometry helpers ---------------------------------------------
  function pressureToWidth(stroke, p){
    return Math.max(0.75, stroke.baseWidth * (0.3 + p * 1.4));
  }
  function getStrokeBBox(stroke){
    let minX=Infinity, minY=Infinity, maxX=-Infinity, maxY=-Infinity;
    for (const pt of stroke.points){
      const hw = pressureToWidth(stroke, pt.p) / 2;
      if (pt.x-hw < minX) minX = pt.x-hw;
      if (pt.x+hw > maxX) maxX = pt.x+hw;
      if (pt.y-hw < minY) minY = pt.y-hw;
      if (pt.y+hw > maxY) maxY = pt.y+hw;
    }
    return { minX, minY, maxX, maxY };
  }
  function computeStrokesBBox(list){
    let minX=Infinity, minY=Infinity, maxX=-Infinity, maxY=-Infinity;
    for (const s of list){
      const b = getStrokeBBox(s);
      minX = Math.min(minX, b.minX); minY = Math.min(minY, b.minY);
      maxX = Math.max(maxX, b.maxX); maxY = Math.max(maxY, b.maxY);
    }
    return { minX, minY, maxX, maxY };
  }
  function strokeIntersectsRect(stroke, rect){
    const b = getStrokeBBox(stroke);
    return !(b.maxX < rect.minX || b.minX > rect.maxX || b.maxY < rect.minY || b.minY > rect.maxY);
  }
  function strokeHitByCircle(stroke, center, r){
    const pts = stroke.points;
    if (pts.length === 1){
      return dist(pts[0], center) <= r + pressureToWidth(stroke, pts[0].p)/2;
    }
    for (let i=0; i<pts.length-1; i++){
      const halfw = Math.max(pressureToWidth(stroke, pts[i].p), pressureToWidth(stroke, pts[i+1].p)) / 2;
      if (distToSegment(center, pts[i], pts[i+1]) <= r + halfw) return true;
    }
    return false;
  }
  function hitTestStroke(p){
    for (let i = strokes.length-1; i >= 0; i--){
      if (strokeHitByCircle(strokes[i], p, 6/camera.zoom)) return strokes[i];
    }
    return null;
  }

  // Precision eraser: true vector path-splitting. Points inside the eraser
  // circle (or segments passing through it) are removed; the remaining
  // contiguous runs become brand new strokes. No compositing tricks — the
  // underlying path data is genuinely cut, so it exports perfectly too.
  function makeSubStroke(orig, pts){
    return { id: nextId++, color: orig.color, baseWidth: orig.baseWidth, points: pts.slice() };
  }
  function splitStrokeByEraser(stroke, center, r){
    if (!strokeHitByCircle(stroke, center, r)) return [stroke];
    const pts = stroke.points;
    const n = pts.length;
    const erased = new Array(n).fill(false);
    for (let i=0; i<n; i++){
      const halfw = pressureToWidth(stroke, pts[i].p) / 2;
      if (dist(pts[i], center) <= r + halfw) erased[i] = true;
    }
    for (let i=0; i<n-1; i++){
      if (erased[i] && erased[i+1]) continue;
      const halfw = Math.max(pressureToWidth(stroke, pts[i].p), pressureToWidth(stroke, pts[i+1].p)) / 2;
      if (distToSegment(center, pts[i], pts[i+1]) <= r + halfw){ erased[i] = true; erased[i+1] = true; }
    }
    const result = [];
    let run = [];
    for (let i=0; i<n; i++){
      if (!erased[i]) run.push(pts[i]);
      else { if (run.length) { result.push(makeSubStroke(stroke, run)); run = []; } }
    }
    if (run.length) result.push(makeSubStroke(stroke, run));
    return result;
  }
  function applyEraseAt(center, mode){
    const r = state.eraserRadius / camera.zoom;
    if (mode === 'stroke'){
      strokes = strokes.filter(s => !strokeHitByCircle(s, center, r));
    } else {
      const next = [];
      for (const s of strokes) { for (const part of splitStrokeByEraser(s, center, r)) next.push(part); }
      strokes = next;
    }
  }

  // ---- history (undo/redo) -------------------------------------------------
  function snapshot(){
    return strokes.map(s => ({ id: s.id, color: s.color, baseWidth: s.baseWidth, points: s.points.map(p => ({x:p.x,y:p.y,p:p.p})) }));
  }
  function pushHistory(){
    history.push(snapshot());
    if (history.length > HISTORY_LIMIT) history.shift();
    future = [];
  }
  function undo(){
    if (!history.length) return;
    future.push(snapshot());
    strokes = history.pop();
    selectedIds.clear();
    requestRenderNow();
  }
  function redo(){
    if (!future.length) return;
    history.push(snapshot());
    strokes = future.pop();
    selectedIds.clear();
    requestRenderNow();
  }

  // ---- drawing (pen) --------------------------------------------------------
  function normalizedPressure(e){
    if (e.pointerType === 'pen' && e.pressure > 0) return e.pressure;
    return 0.5; // mouse / touch / unsupported hardware
  }
  function startStroke(e){
    pushHistory();
    const p = screenToWorld(e.clientX, e.clientY);
    currentStroke = { id: nextId++, color: state.color, baseWidth: state.baseWidth, points: [{x:p.x,y:p.y,p:normalizedPressure(e)}] };
    strokes.push(currentStroke);
    lastDrawPoint = p;
    requestRenderNow();
  }
  function moveStroke(e){
    const minDist = 1.2 / camera.zoom; // screen-space-consistent sampling density
    for (const ev of getEvents(e)){
      const p = screenToWorld(ev.clientX, ev.clientY);
      if (Math.hypot(p.x-lastDrawPoint.x, p.y-lastDrawPoint.y) < minDist) continue;
      currentStroke.points.push({ x:p.x, y:p.y, p:normalizedPressure(ev) });
      lastDrawPoint = p;
    }
    requestRenderNow();
  }
  function endStroke(){ currentStroke = null; lastDrawPoint = null; }

  // ---- erasing ----------------------------------------------------------
  function startErase(e, mode){
    pushHistory();
    erasing = { mode };
    applyEraseAt(screenToWorld(e.clientX, e.clientY), mode);
    requestRenderNow();
  }
  function moveErase(e){
    for (const ev of getEvents(e)) applyEraseAt(screenToWorld(ev.clientX, ev.clientY), erasing.mode);
    requestRenderNow();
  }
  function endErase(){ erasing = null; }

  // ---- select tool --------------------------------------------------------
  function startSelect(e){
    const p = screenToWorld(e.clientX, e.clientY);
    const hit = hitTestStroke(p);
    if (hit){
      if (!e.shiftKey && !selectedIds.has(hit.id)) selectedIds.clear();
      selectedIds.add(hit.id);
      selectDrag = { lastWorld: p, historyPushed: false };
    } else {
      if (!e.shiftKey) selectedIds.clear();
      rubberBand = { startWorld: p, curWorld: p };
    }
    requestRenderNow();
  }
  function moveSelect(e){
    const p = screenToWorld(e.clientX, e.clientY);
    if (selectDrag){
      const dx = p.x - selectDrag.lastWorld.x, dy = p.y - selectDrag.lastWorld.y;
      if (dx !== 0 || dy !== 0){
        if (!selectDrag.historyPushed){ pushHistory(); selectDrag.historyPushed = true; }
        for (const s of strokes) if (selectedIds.has(s.id)) for (const pt of s.points){ pt.x += dx; pt.y += dy; }
      }
      selectDrag.lastWorld = p;
    } else if (rubberBand){
      rubberBand.curWorld = p;
      const rect = normalizeRect(rubberBand.startWorld, rubberBand.curWorld);
      selectedIds.clear();
      for (const s of strokes) if (strokeIntersectsRect(s, rect)) selectedIds.add(s.id);
    }
    requestRenderNow();
  }
  function endSelect(){ selectDrag = null; rubberBand = null; requestRenderNow(); }

  // ---- panning ------------------------------------------------------------
  function startPan(e){
    panState = { pointerId: e.pointerId, startScreenX: e.clientX, startScreenY: e.clientY, startPanX: camera.panX, startPanY: camera.panY };
    canvas.style.cursor = 'grabbing';
  }
  function updatePan(e){
    camera.panX = panState.startPanX + (e.clientX - panState.startScreenX);
    camera.panY = panState.startPanY + (e.clientY - panState.startScreenY);
    requestRenderNow();
  }
  function endPan(){ panState = null; updateCursorForTool(); }

  // ---- pinch (touch zoom + pan) ---------------------------------------------
  function startPinch(){
    const pts = Array.from(activePointers.values());
    if (pts.length < 2) return;
    const [a,b] = pts;
    const mid = { x:(a.x+b.x)/2, y:(a.y+b.y)/2 };
    pinch = { startDist: Math.hypot(a.x-b.x, a.y-b.y) || 1, startZoom: camera.zoom, startMidWorld: screenToWorld(mid.x, mid.y) };
  }
  function updatePinch(){
    const pts = Array.from(activePointers.values());
    if (pts.length < 2 || !pinch) return;
    const [a,b] = pts;
    const d = Math.hypot(a.x-b.x, a.y-b.y) || 1;
    const mid = { x:(a.x+b.x)/2, y:(a.y+b.y)/2 };
    camera.zoom = clamp(pinch.startZoom * (d / pinch.startDist), MIN_ZOOM, MAX_ZOOM);
    camera.panX = mid.x - pinch.startMidWorld.x * camera.zoom;
    camera.panY = mid.y - pinch.startMidWorld.y * camera.zoom;
    requestRenderNow();
  }
  function cancelActiveActions(){
    panState = null; currentStroke = null; erasing = null; selectDrag = null; rubberBand = null;
  }

  // ---- rendering ------------------------------------------------------------
  function niceGridSpacing(zoom, targetPx){
    let raw = targetPx / zoom;
    if (raw <= 0) raw = 1;
    const mag = Math.pow(10, Math.floor(Math.log10(raw)));
    const norm = raw / mag;
    let mult = norm < 1.5 ? 1 : norm < 3.5 ? 2 : norm < 7.5 ? 5 : 10;
    return mag * mult;
  }
  function drawGrid(){
    const topLeft = screenToWorld(0, 0);
    const bottomRight = screenToWorld(window.innerWidth, window.innerHeight);
    const spacing = niceGridSpacing(camera.zoom, 90);
    const majorEvery = 5;
    ctx.save();
    ctx.lineWidth = 1 / camera.zoom;
    const startI = Math.floor(topLeft.x / spacing);
    for (let i = startI; i*spacing < bottomRight.x + spacing; i++){
      const x = i*spacing;
      ctx.strokeStyle = (i % majorEvery === 0) ? 'rgba(20,21,26,0.10)' : 'rgba(20,21,26,0.045)';
      ctx.beginPath(); ctx.moveTo(x, topLeft.y); ctx.lineTo(x, bottomRight.y); ctx.stroke();
    }
    const startJ = Math.floor(topLeft.y / spacing);
    for (let j = startJ; j*spacing < bottomRight.y + spacing; j++){
      const y = j*spacing;
      ctx.strokeStyle = (j % majorEvery === 0) ? 'rgba(20,21,26,0.10)' : 'rgba(20,21,26,0.045)';
      ctx.beginPath(); ctx.moveTo(topLeft.x, y); ctx.lineTo(bottomRight.x, y); ctx.stroke();
    }
    if (topLeft.x <= 0 && bottomRight.x >= 0){
      ctx.strokeStyle = 'rgba(255,92,92,0.35)';
      ctx.beginPath(); ctx.moveTo(0, topLeft.y); ctx.lineTo(0, bottomRight.y); ctx.stroke();
    }
    if (topLeft.y <= 0 && bottomRight.y >= 0){
      ctx.strokeStyle = 'rgba(61,92,255,0.35)';
      ctx.beginPath(); ctx.moveTo(topLeft.x, 0); ctx.lineTo(bottomRight.x, 0); ctx.stroke();
    }
    ctx.restore();
  }

  // Pure function: draws one stroke into any 2D context that already has the
  // desired transform applied. Used for the live canvas AND for PNG export,
  // so on-screen and exported output are guaranteed to match.
  function drawStroke(targetCtx, stroke){
    const pts = stroke.points;
    if (!pts.length) return;
    targetCtx.strokeStyle = stroke.color;
    targetCtx.fillStyle = stroke.color;
    targetCtx.lineCap = 'round';
    targetCtx.lineJoin = 'round';
    if (pts.length === 1){
      const r = pressureToWidth(stroke, pts[0].p) / 2;
      targetCtx.beginPath();
      targetCtx.arc(pts[0].x, pts[0].y, r, 0, Math.PI*2);
      targetCtx.fill();
      return;
    }
    for (let i=0; i<pts.length-1; i++){
      const p0 = pts[i], p1 = pts[i+1];
      targetCtx.lineWidth = (pressureToWidth(stroke,p0.p) + pressureToWidth(stroke,p1.p)) / 2;
      targetCtx.beginPath();
      targetCtx.moveTo(p0.x, p0.y);
      targetCtx.lineTo(p1.x, p1.y);
      targetCtx.stroke();
    }
  }

  function drawSelectionOutline(stroke){
    const b = getStrokeBBox(stroke);
    const pad = 6 / camera.zoom;
    const x = b.minX-pad, y = b.minY-pad, w = (b.maxX-b.minX)+pad*2, h = (b.maxY-b.minY)+pad*2;
    ctx.save();
    ctx.strokeStyle = 'rgba(53,224,198,0.9)';
    ctx.lineWidth = 1.5 / camera.zoom;
    ctx.setLineDash([5/camera.zoom, 4/camera.zoom]);
    ctx.strokeRect(x, y, w, h);
    ctx.setLineDash([]);
    const t = 8 / camera.zoom;
    ctx.lineWidth = 2 / camera.zoom;
    const corners = [[x,y,1,1],[x+w,y,-1,1],[x,y+h,1,-1],[x+w,y+h,-1,-1]];
    for (const [cx,cy,sx,sy] of corners){
      ctx.beginPath();
      ctx.moveTo(cx, cy+t*sy); ctx.lineTo(cx, cy); ctx.lineTo(cx+t*sx, cy);
      ctx.stroke();
    }
    ctx.restore();
  }
  function drawRubberBand(){
    const r = normalizeRect(rubberBand.startWorld, rubberBand.curWorld);
    ctx.save();
    ctx.fillStyle = 'rgba(53,224,198,0.12)';
    ctx.strokeStyle = 'rgba(53,224,198,0.9)';
    ctx.lineWidth = 1 / camera.zoom;
    ctx.fillRect(r.minX, r.minY, r.maxX-r.minX, r.maxY-r.minY);
    ctx.strokeRect(r.minX, r.minY, r.maxX-r.minX, r.maxY-r.minY);
    ctx.restore();
  }
  function drawEraserPreview(){
    if (state.tool !== 'eraser-stroke' && state.tool !== 'eraser-precision') return;
    if (!lastPointerScreen || panState || pinch) return;
    ctx.save();
    ctx.beginPath();
    ctx.arc(lastPointerScreen.x, lastPointerScreen.y, state.eraserRadius, 0, Math.PI*2);
    ctx.strokeStyle = state.tool === 'eraser-stroke' ? 'rgba(255,92,92,0.9)' : 'rgba(53,224,198,0.9)';
    ctx.lineWidth = 1.5;
    ctx.setLineDash([4,3]);
    ctx.stroke();
    ctx.restore();
  }

  function render(){
    ctx.setTransform(1,0,0,1,0,0);
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = PAPER_COLOR;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.setTransform(dpr*camera.zoom, 0, 0, dpr*camera.zoom, dpr*camera.panX, dpr*camera.panY);
    drawGrid();
    for (const s of strokes) drawStroke(ctx, s);
    for (const s of strokes) if (selectedIds.has(s.id)) drawSelectionOutline(s);
    if (rubberBand) drawRubberBand();

    ctx.setTransform(dpr,0,0,dpr,0,0);
    drawEraserPreview();
    ctx.setTransform(1,0,0,1,0,0);
  }

  function requestRenderNow(){ needsRender = true; }
  function updateReadouts(){
    zoomReadout.textContent = Math.round(camera.zoom*100) + '%';
    if (lastPointerScreen){
      const w = screenToWorld(lastPointerScreen.x, lastPointerScreen.y);
      coordReadout.textContent = 'X ' + w.x.toFixed(0) + '  Y ' + w.y.toFixed(0);
    }
  }
  function frameLoop(){
    if (needsRender){ render(); needsRender = false; updateReadouts(); }
    requestAnimationFrame(frameLoop);
  }

  // ---- resize -----------------------------------------------------------
  function resize(){
    dpr = window.devicePixelRatio || 1;
    canvas.width  = Math.round(window.innerWidth * dpr);
    canvas.height = Math.round(window.innerHeight * dpr);
    canvas.style.width  = window.innerWidth + 'px';
    canvas.style.height = window.innerHeight + 'px';
    requestRenderNow();
  }
  window.addEventListener('resize', resize);

  // ---- cursor / tool switching --------------------------------------------
  function updateCursorForTool(){
    if (spaceDown){ canvas.style.cursor = 'grab'; return; }
    switch(state.tool){
      case 'pen': canvas.style.cursor = 'crosshair'; break;
      case 'eraser-stroke':
      case 'eraser-precision': canvas.style.cursor = 'none'; break;
      case 'hand': canvas.style.cursor = 'grab'; break;
      case 'select': canvas.style.cursor = 'default'; break;
    }
  }
  function setTool(name){
    state.tool = name;
    document.querySelectorAll('.tool-btn').forEach(btn => btn.classList.toggle('active', btn.dataset.tool === name));
    if (name === 'eraser-stroke' || name === 'eraser-precision'){
      sizeLabel.textContent = 'Eraser size';
      sizeSlider.min = 4; sizeSlider.max = 100; sizeSlider.value = state.eraserRadius;
    } else {
      sizeLabel.textContent = 'Brush size';
      sizeSlider.min = 1; sizeSlider.max = 60; sizeSlider.value = state.baseWidth;
    }
    sizeValue.textContent = sizeSlider.value;
    updateCursorForTool();
    requestRenderNow();
  }

  // ---- pointer event wiring -------------------------------------------------
  canvas.addEventListener('contextmenu', e => e.preventDefault());
  canvas.addEventListener('dragstart', e => e.preventDefault());

  canvas.addEventListener('pointerdown', e => {
    canvas.setPointerCapture(e.pointerId);
    activePointers.set(e.pointerId, { x:e.clientX, y:e.clientY });
    lastPointerScreen = { x:e.clientX, y:e.clientY };

    if (activePointers.size >= 2){
      cancelActiveActions();
      startPinch();
      return;
    }
    if (e.button === 1){ e.preventDefault(); startPan(e); return; }
    if (e.button === 2) return;

    const wantsPan = spaceDown || (e.shiftKey && e.button === 0) || (state.tool === 'hand' && e.button === 0);
    if (wantsPan){ startPan(e); return; }

    if (e.button === 0){
      if (state.tool === 'pen') startStroke(e);
      else if (state.tool === 'eraser-stroke') startErase(e, 'stroke');
      else if (state.tool === 'eraser-precision') startErase(e, 'precision');
      else if (state.tool === 'select') startSelect(e);
    }
  });

  canvas.addEventListener('pointermove', e => {
    if (activePointers.has(e.pointerId)) activePointers.set(e.pointerId, { x:e.clientX, y:e.clientY });
    lastPointerScreen = { x:e.clientX, y:e.clientY };

    if (pinch && activePointers.size >= 2){ updatePinch(); return; }
    if (panState){ updatePan(e); return; }
    if (currentStroke){ moveStroke(e); return; }
    if (erasing){ moveErase(e); return; }
    if (selectDrag || rubberBand){ moveSelect(e); return; }
    requestRenderNow(); // keep eraser-radius preview & coord readout live even when idle
  });

  function onPointerEnd(e){
    activePointers.delete(e.pointerId);
    if (pinch && activePointers.size < 2) pinch = null;
    if (panState && panState.pointerId === e.pointerId) endPan();
    if (currentStroke) endStroke();
    if (erasing) endErase();
    if (selectDrag || rubberBand) endSelect();
    try { canvas.releasePointerCapture(e.pointerId); } catch(err){}
    requestRenderNow();
    localStorage.setItem('infinite-canvas-save', JSON.stringify(strokes)); // added for local memory
  }
  canvas.addEventListener('pointerup', onPointerEnd);
  canvas.addEventListener('pointercancel', onPointerEnd);
  canvas.addEventListener('pointerleave', () => { lastPointerScreen = null; requestRenderNow(); });

  canvas.addEventListener('wheel', e => {
    e.preventDefault();
    const factor = Math.exp(-e.deltaY * 0.0016);
    zoomAt(e.clientX, e.clientY, factor);
  }, { passive:false });

  // Minimize Panel Logic
  document.querySelectorAll('.toggle-btn').forEach(btn => {
    btn.addEventListener('click', (e) => {
      const panel = e.target.closest('.panel');
      panel.classList.toggle('collapsed');
      
      // Swap the arrow icon up/down
      const isCollapsed = panel.classList.contains('collapsed');
      btn.innerHTML = isCollapsed 
        ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 10 12 18 20 10"></polyline></svg>'
        : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 14 12 6 20 14"></polyline></svg>';
    });
  });

  // ---- keyboard ------------------------------------------------------------
  window.addEventListener('keydown', e => {
    const tag = document.activeElement && document.activeElement.tagName;
    if (tag === 'INPUT' || tag === 'TEXTAREA') return;

    if (e.code === 'Space' && !spaceDown){ spaceDown = true; updateCursorForTool(); e.preventDefault(); return; }
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z'){ e.preventDefault(); e.shiftKey ? redo() : undo(); return; }
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'y'){ e.preventDefault(); redo(); return; }
    if (e.key === 'Delete' || e.key === 'Backspace'){
      if (selectedIds.size){
        pushHistory();
        strokes = strokes.filter(s => !selectedIds.has(s.id));
        selectedIds.clear();
        requestRenderNow();
        e.preventDefault();
      }
      return;
    }
    switch(e.key.toLowerCase()){
      case 'p': setTool('pen'); break;
      case 'e': setTool('eraser-stroke'); break;
      case 'x': setTool('eraser-precision'); break;
      case 'h': setTool('hand'); break;
      case 'v': case 's': setTool('select'); break;
      case '0': resetView(); break;
    }
  });
  window.addEventListener('keyup', e => { if (e.code === 'Space'){ spaceDown = false; updateCursorForTool(); } });

  // ---- toolbar wiring ------------------------------------------------------
  document.querySelectorAll('.tool-btn').forEach(btn => btn.addEventListener('click', () => setTool(btn.dataset.tool)));

  document.querySelectorAll('.swatch').forEach(btn => {
    btn.addEventListener('click', () => {
      state.color = btn.dataset.color;
      document.querySelectorAll('.swatch').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('customColor').value = state.color;
    });
  });
  document.getElementById('customColor').addEventListener('input', e => {
    state.color = e.target.value;
    document.querySelectorAll('.swatch').forEach(b => b.classList.remove('active'));
  });

  sizeSlider.addEventListener('input', e => {
    const v = Number(e.target.value);
    sizeValue.textContent = v;
    if (state.tool === 'eraser-stroke' || state.tool === 'eraser-precision') state.eraserRadius = v;
    else state.baseWidth = v;
    requestRenderNow();
  });

  document.getElementById('resetViewBtn').addEventListener('click', resetView);
  document.getElementById('undoBtn').addEventListener('click', undo);
  document.getElementById('redoBtn').addEventListener('click', redo);

  // clear button script
  document.getElementById('clearCanvasBtn').addEventListener('click', () => {
    if (confirm('Are you sure you want to clear the entire canvas?')) {
      strokes = [];
      localStorage.removeItem('infinite-canvas-save');
      requestRenderNow();
      showToast('Canvas cleared');
    }
  });

  // save/load logic

  // Save to JSON File
  document.getElementById('saveFileBtn').addEventListener('click', () => {
    if (!strokes.length) { showToast('Nothing to save yet'); return; }
    const data = JSON.stringify(strokes);
    const blob = new Blob([data], {type: 'application/json'});
    const url = URL.createObjectURL(blob);
    triggerDownload(url, 'my-drawing.json');
    showToast('File saved');
  });

  // Load from JSON File
  document.getElementById('loadFileBtn').addEventListener('click', () => {
    document.getElementById('fileInput').click();
  });
  
  document.getElementById('fileInput').addEventListener('change', e => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      try {
        strokes = JSON.parse(ev.target.result);
        localStorage.setItem('infinite-canvas-save', JSON.stringify(strokes));
        resetView();
        showToast('File loaded');
      } catch (err) {
        showToast('Error loading file');
      }
    };
    reader.readAsText(file);
    e.target.value = ''; // Reset input
  });
  //end

  document.getElementById('helpBtn').addEventListener('click', e => { e.stopPropagation(); helpPop.classList.toggle('show'); });
  window.addEventListener('click', e => { if (!helpPop.contains(e.target) && e.target.id !== 'helpBtn') helpPop.classList.remove('show'); });

  // ---- toast -----------------------------------------------------------
  let toastTimer = null;
  function showToast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2200);
  }

  // ---- export ----------------------------------------------------------
  function triggerDownload(url, filename){
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
  }

  document.getElementById('exportPngBtn').addEventListener('click', () => {
    if (!strokes.length){ showToast('Nothing to export yet'); return; }
    const bbox = computeStrokesBBox(strokes);
    const pad = 40, scale = 2;
    const w = (bbox.maxX-bbox.minX) + pad*2;
    const h = (bbox.maxY-bbox.minY) + pad*2;
    const off = document.createElement('canvas');
    off.width = Math.max(1, Math.round(w*scale));
    off.height = Math.max(1, Math.round(h*scale));
    const octx = off.getContext('2d');
    octx.fillStyle = '#FFFFFF';
    octx.fillRect(0, 0, off.width, off.height);
    octx.setTransform(scale, 0, 0, scale, (pad-bbox.minX)*scale, (pad-bbox.minY)*scale);
    for (const s of strokes) drawStroke(octx, s);
    triggerDownload(off.toDataURL('image/png'), 'vector-sketch.png');
    showToast('PNG exported');
  });

  function strokeToSVGPaths(stroke, offX, offY){
    const pts = stroke.points;
    if (!pts.length) return '';
    if (pts.length === 1){
      const r = pressureToWidth(stroke, pts[0].p)/2;
      return '<circle cx="'+(pts[0].x+offX).toFixed(2)+'" cy="'+(pts[0].y+offY).toFixed(2)+'" r="'+r.toFixed(2)+'" fill="'+stroke.color+'"/>\n';
    }
    let out = '';
    for (let i=0; i<pts.length-1; i++){
      const p0 = pts[i], p1 = pts[i+1];
      const w = (pressureToWidth(stroke,p0.p) + pressureToWidth(stroke,p1.p)) / 2;
      out += '<path d="M'+(p0.x+offX).toFixed(2)+' '+(p0.y+offY).toFixed(2)+' L'+(p1.x+offX).toFixed(2)+' '+(p1.y+offY).toFixed(2)+
             '" stroke="'+stroke.color+'" stroke-width="'+w.toFixed(2)+'" stroke-linecap="round" fill="none"/>\n';
    }
    return out;
  }
  document.getElementById('exportSvgBtn').addEventListener('click', () => {
    if (!strokes.length){ showToast('Nothing to export yet'); return; }
    const bbox = computeStrokesBBox(strokes);
    const pad = 40;
    const w = (bbox.maxX-bbox.minX) + pad*2;
    const h = (bbox.maxY-bbox.minY) + pad*2;
    const offX = pad - bbox.minX, offY = pad - bbox.minY;
    let body = '';
    for (const s of strokes) body += strokeToSVGPaths(s, offX, offY);
    const svg = '<?xml version="1.0" encoding="UTF-8"?>\n' +
      '<svg xmlns="http://www.w3.org/2000/svg" width="'+w.toFixed(0)+'" height="'+h.toFixed(0)+'" viewBox="0 0 '+w.toFixed(0)+' '+h.toFixed(0)+'">\n' +
      '<rect width="100%" height="100%" fill="#ffffff"/>\n' + body + '</svg>\n';
    const blob = new Blob([svg], { type:'image/svg+xml' });
    const url = URL.createObjectURL(blob);
    triggerDownload(url, 'vector-sketch.svg');
    setTimeout(() => URL.revokeObjectURL(url), 1500);
    showToast('SVG exported');
  });


  // ---- init ---------------------------------------------------------------
  function init(){
    loadLocalStrokes();
    resize();
    camera.panX = window.innerWidth / 2;
    camera.panY = window.innerHeight / 2;
    setTool('pen');
    const activeSwatch = document.querySelector('.swatch[data-color="'+state.color+'"]');
    if (activeSwatch) activeSwatch.classList.add('active');
    document.getElementById('customColor').value = state.color;
    requestAnimationFrame(frameLoop);
  }
  init();

})();
</script>
</body>
